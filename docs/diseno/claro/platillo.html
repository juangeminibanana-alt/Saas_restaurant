<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Arrachera al carbón — Brasa Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Iconos: trazo único de 1.75, extremos redondos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></symbol>
  <symbol id="i-minus" viewBox="0 0 20 20"><path d="M4.5 10h11"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.75 8.5l2.75 2.75 5.75-6.5"/></symbol>
</svg>

<main class="page detail">

  <div class="media media--hero">
    <img class="media__photo" src="../fotos/arrachera_papas.jpg" alt="Arrachera rebanada con papas a la francesa y hierbas en plato blanco">
    <a class="fab" href="menu.html" aria-label="Cerrar y volver al menú"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></a>
  </div>

  <div class="detail__body">
    <h1 class="detail__name">Arrachera al carbón</h1>
    <p class="detail__price num">$345</p>
    <p class="detail__desc">Rebanada a las brasas, con papas a la francesa doradas y hierbas frescas.</p>

    <fieldset class="group">
      <legend class="group__head">
        <span class="group__title">Término</span>
        <span class="group__rule group__rule--req">Obligatorio</span>
      </legend>
      <div class="seg">
        <input class="sr" type="radio" name="termino" id="t-rojo"><label for="t-rojo">Rojo</label>
        <input class="sr" type="radio" name="termino" id="t-medio" checked><label for="t-medio">Medio</label>
        <input class="sr" type="radio" name="termino" id="t-tres"><label for="t-tres">Tres cuartos</label>
        <input class="sr" type="radio" name="termino" id="t-bien"><label for="t-bien">Bien cocido</label>
      </div>
    </fieldset>

    <!-- Opcional: casillas, no radios. La guarnición incluida viene marcada y se puede quitar. -->
    <fieldset class="group">
      <legend class="group__head">
        <span class="group__title">Guarnición</span>
        <span class="group__rule">Opcional</span>
      </legend>
      <div class="opts">
        <label class="opt">
          <input class="sr" type="checkbox" name="guarnicion" value="papas" checked>
          <span class="opt__name">Papas a la francesa</span>
          <span class="opt__mark" aria-hidden="true"><svg class="i i--s"><use href="#i-check"/></svg></span>
        </label>
        <label class="opt">
          <input class="sr" type="checkbox" name="guarnicion" value="ensalada">
          <span class="opt__name">Ensalada verde</span>
          <span class="opt__mark" aria-hidden="true"><svg class="i i--s"><use href="#i-check"/></svg></span>
        </label>
        <label class="opt">
          <input class="sr" type="checkbox" name="guarnicion" value="esquites">
          <span class="opt__name">Esquites</span>
          <span class="opt__delta num">+$25</span>
          <span class="opt__mark" aria-hidden="true"><svg class="i i--s"><use href="#i-check"/></svg></span>
        </label>
      </div>
    </fieldset>
  </div>

</main>

<div class="bar">
  <div class="stepper" role="group" aria-label="Cantidad">
    <button type="button" aria-label="Quitar uno" disabled><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
    <output>1</output>
    <button type="button" aria-label="Agregar uno más"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>
  <button class="cta" type="button">Agregar<span aria-hidden="true">·</span><span class="num">$345</span></button>
</div>

</body>
</html>
