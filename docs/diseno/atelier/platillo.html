<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Arrachera al carbón — Brasa Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="has-dock">

<main class="page">

  <!-- la misma cabecera del menú: una fila de 44 y la lámina debajo.
       A la izquierda, el regreso dice a dónde vuelve; a la derecha firma la casa (o su logotipo). -->
  <header class="masthead">
    <div class="masthead__top">
      <a class="back" href="menu.html#parrilla" aria-label="Volver al menú, De la parrilla">
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10h-13M8.5 4.5L3 10l5.5 5.5"/></svg>
        <span class="label">De la parrilla</span>
      </a>
      <p class="label label--ink label--end">Brasa Demo</p>
    </div>
  </header>

  <!-- la lámina abierta del menú, sin cambiar de tamaño: 342 × 272.
       La foto se pinta a 408 de ancho (3:2 recortada a 5:4): la de catálogo (900) alcanza hasta 2x;
       a 3x el navegador toma la versión de 1368 y ninguna pantalla la amplía. -->
  <figure class="plate-frame plate-frame--open">
    <img src="../fotos/arrachera_papas.jpg"
         srcset="../fotos/arrachera_papas.jpg 900w, fotos-3x/arrachera_papas-1368.jpg 1368w"
         sizes="calc((min(100vw, 480px) - 48px) * 1.2)"
         alt="Arrachera rebanada con papas a la francesa y hierbas frescas en plato blanco">
  </figure>

  <header class="open__head">
    <div class="open__title">
      <h1>Arrachera al carbón</h1>
      <p class="price">$345</p>
    </div>
    <p class="open__desc">Marinada, asada al carbón y rebanada al momento.</p>
    <dl class="facts facts--inline">
      <div>
        <dt>Porción</dt>
        <dd>300 g</dd>
      </div>
      <div>
        <dt>Listo en</dt>
        <dd>25–35 min</dd>
      </div>
    </dl>
  </header>

  <form class="groups" action="#" method="post" id="pedido">

    <section class="group" role="radiogroup" aria-labelledby="g-termino" aria-required="true">
      <header class="group__head">
        <h2 class="group__title" id="g-termino">Término</h2>
        <p class="label label--ink label--end">Obligatorio</p>
      </header>
      <div class="segments">
        <label class="segment"><input class="sr-only" type="radio" name="termino" value="rojo" required><span>Rojo</span></label>
        <label class="segment"><input class="sr-only" type="radio" name="termino" value="medio" checked><span>Medio</span></label>
        <label class="segment"><input class="sr-only" type="radio" name="termino" value="tres-cuartos"><span>Tres cuartos</span></label>
        <label class="segment"><input class="sr-only" type="radio" name="termino" value="bien-cocido"><span>Bien cocido</span></label>
      </div>
    </section>

    <!-- una guarnición va incluida en el precio: viene elegida la de la casa y se puede cambiar.
         Solo la que cuesta más lo dice, y el total del botón la sigue. -->
    <section class="group" role="radiogroup" aria-labelledby="g-guarnicion">
      <header class="group__head">
        <h2 class="group__title" id="g-guarnicion">Guarnición</h2>
        <p class="label label--end">Elige una · incluida</p>
      </header>
      <ul class="options">
        <li><label class="option"><input class="sr-only" type="radio" name="guarnicion" value="papas" checked><span class="option__name">Papas a la francesa</span><span class="radio" aria-hidden="true"></span></label></li>
        <li><label class="option"><input class="sr-only" type="radio" name="guarnicion" value="ensalada"><span class="option__name">Ensalada verde</span><span class="radio" aria-hidden="true"></span></label></li>
        <li><label class="option"><input class="sr-only" type="radio" name="guarnicion" value="esquites" data-delta="25"><span class="option__name">Esquites</span><span class="option__delta">+$25</span><span class="radio" aria-hidden="true"></span></label></li>
      </ul>
    </section>

  </form>

</main>

<div class="dock">
  <div class="dock__row">
    <div class="qty" role="group" aria-label="Cantidad">
      <button class="qty__btn" type="button" aria-label="Quitar uno">
        <svg class="icon icon--sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
      </button>
      <span class="qty__n" aria-live="polite">1</span>
      <button class="qty__btn" type="button" aria-label="Agregar uno">
        <svg class="icon icon--sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>
    <button class="cta" type="submit" form="pedido">Agregar · <span class="total__base">$345</span><span class="total__plus">$370</span></button>
  </div>
</div>

</body>
</html>
