<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Arrachera al carbón · Brasa Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 20 20"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></symbol>
  <symbol id="i-minus" viewBox="0 0 20 20"><path d="M4.5 10h11"/></symbol>
</svg>

<div class="app has-bar">
  <main>
    <figure class="hero hero--dish ph" style="--fp:50% 50%">
      <img src="../fotos/arrachera_papas.jpg" srcset="../fotos/arrachera_papas.jpg 900w, img/arrachera_papas-1200.jpg 1200w, img/arrachera_papas-1800.jpg 1800w" sizes="150vw" alt="Arrachera rebanada con papas a la francesa y hierbas en plato blanco">
      <a class="hero__btn hero__btn--start" href="menu.html" aria-label="Cerrar y volver al menú"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></a>
    </figure>

    <header class="dish__head">
      <p class="label">De la parrilla</p>
      <div class="dish__line">
        <h1 class="dish__name">Arrachera al carbón</h1>
        <span class="dish__price">$345</span>
      </div>
      <p class="dish__desc">Arrachera a las brasas, rebanada y servida con papas a la francesa y hierbas frescas.</p>
    </header>

    <!-- Obligatorio y sin valor por defecto: la brasa avisa hasta que se elige (.is-done la apaga). -->
    <section class="group is-done" aria-labelledby="g-termino">
      <div class="group__head">
        <h2 class="group__title" id="g-termino">Término</h2>
        <span class="label label--req">Elige 1</span>
      </div>
      <div class="seg" role="radiogroup" aria-labelledby="g-termino" aria-required="true">
        <button class="seg__item" type="button" data-t="Rojo" role="radio" aria-checked="false"><span>Rojo</span></button>
        <button class="seg__item is-on" type="button" data-t="Medio" role="radio" aria-checked="true"><span>Medio</span></button>
        <button class="seg__item" type="button" data-t="Tres cuartos" role="radio" aria-checked="false"><span>Tres cuartos</span></button>
        <button class="seg__item" type="button" data-t="Bien cocido" role="radio" aria-checked="false"><span>Bien cocido</span></button>
      </div>
    </section>

    <!-- Viene incluida (papas por defecto); cambiarla es opcional. Sólo los esquites suman. -->
    <section class="group is-done" aria-labelledby="g-guarnicion">
      <div class="group__head">
        <h2 class="group__title" id="g-guarnicion">Guarnición</h2>
        <span class="label">Elige 1 · incluida</span>
      </div>
      <div class="opts" role="radiogroup" aria-labelledby="g-guarnicion">
        <button class="opt is-on" type="button" role="radio" aria-checked="true">
          <span class="radio" aria-hidden="true"></span>
          <span class="opt__name">Papas a la francesa</span>
        </button>
        <button class="opt" type="button" role="radio" aria-checked="false">
          <span class="radio" aria-hidden="true"></span>
          <span class="opt__name">Ensalada verde</span>
        </button>
        <button class="opt" type="button" role="radio" aria-checked="false">
          <span class="radio" aria-hidden="true"></span>
          <span class="opt__name">Esquites</span>
          <span class="opt__delta">+$25</span>
        </button>
      </div>
    </section>
  </main>
</div>

<aside class="bar" aria-label="Agregar al pedido">
  <div class="stepper stepper--lg" role="group" aria-label="Cantidad">
    <button type="button" aria-label="Quitar uno" disabled><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
    <output>1</output>
    <button type="button" aria-label="Agregar uno"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>
  <button class="btn" type="button">Agregar<span class="sep">·</span><span class="mono">$345</span></button>
</aside>

</body>
</html>
