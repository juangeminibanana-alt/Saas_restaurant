<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FAF9F6">
    <title>Menú</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #FAF9F6;
        }
        #boot-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FAF9F6;
            z-index: 10;
        }
        #boot-loader::after {
            content: "";
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: rgba(0, 0, 0, 0.55);
            animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            #boot-loader::after { animation-duration: 2.4s; }
        }
    </style>
</head>
<body>
<div id="boot-loader" role="status" aria-label="Cargando"></div>
<script>
    (function () {
        var loader = document.getElementById('boot-loader');
        function appMounted() {
            return document.querySelector('canvas') !== null ||
                (document.body.shadowRoot && document.body.shadowRoot.querySelector('canvas') !== null);
        }
        var timer = setInterval(function () {
            if (appMounted()) {
                clearInterval(timer);
                if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
            }
        }, 100);
    })();
</script>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
